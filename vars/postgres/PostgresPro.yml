---
# yamllint disable rule:line-length

# PostgresPro variables
postgresql_bin_dir: "/opt/pgpro/std-{{ postgresql_version }}/bin"
postgresql_unix_socket_dir: "/tmp" #"/var/run/postgresql"

# PostgresPro Standard packages ("-std-" for Standard, "-ent-" for Entarprise Edition)
os_specific_pgpro_packages:
  Debian:
    - postgrespro-{{ postgresql_edition }}-{{ postgresql_version }}-dev
postgresql_packages:
  - postgrespro-{{ postgresql_edition }}-{{ postgresql_version }}-server
  - postgrespro-{{ postgresql_edition }}-{{ postgresql_version }}-client
  - postgrespro-{{ postgresql_edition }}-{{ postgresql_version }}-contrib
  - postgrespro-{{ postgresql_edition }}-{{ postgresql_version }}-libs
  - "{{ os_specific_pgpro_packages[ansible_os_family] }}"

...
