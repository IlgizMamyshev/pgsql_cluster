---
# yamllint disable rule:line-length

- name: "Make sure handlers are flushed immediately"
  meta: flush_handlers

- name: "Make sure the unzip/tar packages are present"
  package:
    name:
      - unzip
      - tar
    state: present
  environment: "{{ proxy_env | default({}) }}"

# install etcd package from repo
- block:
    - name: Ensure the download data directory exists "{{ etcd_package_cache_dir }}"
      ansible.builtin.file:
        path: "{{ etcd_package_cache_dir }}"
        state: directory
        mode: u+x,g+x,o+x
      delegate_to: localhost
      run_once: true

    - name: Check if the etcd package file already exists on Ansible host
      ansible.builtin.stat:
        path: "{{ etcd_package_cache_dir }}/{{ etcd_package_repo | basename }}"
      delegate_to: localhost
      run_once: true
      register: file_stat

    - name: "Download etcd package to Ansible host"
      ansible.builtin.get_url:
        url: "{{ item }}"
        dest: "{{ etcd_package_cache_dir }}"
        timeout: 60
        validate_certs: false
      delegate_to: localhost
      loop:
        - "{{ etcd_package_repo }}"
      environment: "{{ proxy_env | default({}) }}"
      run_once: true
      when: not file_stat.stat.exists

    - name: "Copy etcd package to remote host"
      ansible.builtin.copy:
        src: "{{ etcd_package_cache_dir }}/{{ etcd_package_repo | basename }}"
        dest: /tmp/
        remote_src: false

    - name: "Extract etcd into /tmp"
      unarchive:
        src: "/tmp/{{ etcd_package_repo | basename }}"
        dest: /tmp/
        extra_opts:
          - --no-same-owner
        remote_src: true

    - name: "Copy etcd and etcdctl binary files to /usr/local/bin/"
      ansible.builtin.copy:
        src: "/tmp/{{ etcd_package_repo.split('.tar.gz')[0] | basename }}/{{ item }}"
        dest: /usr/local/bin/
        mode: u+x,g+x,o+x
        remote_src: true
      loop:
        - etcd
        - etcdctl
  when: etcd_package_repo | length > 0

- name: "Add etcd user"
  ansible.builtin.user:
    name: etcd
    shell: /usr/sbin/nologin
    home: "{{ etcd_data_dir }}"

- name: "Create directory for etcd configuration"
  file:
    path: "{{ item }}"
    state: directory
    owner: etcd
    group: etcd
    mode: 0755
  with_items:
    - /etc/etcd
    - /etc/etcd/ssl

- name: "Copy over the CA certificate"
  copy:
    src: "{{ pki_cert_artifacts_dir }}/ca.crt"
    remote_src: false
    dest: /etc/etcd/ssl/ca.crt
    owner: etcd
    group: etcd
    mode: 0644
- name: "Copy over the etcd member certificate"
  copy:
    src: "{{ pki_cert_artifacts_dir }}/{{inventory_hostname}}.crt"
    remote_src: false
    dest: /etc/etcd/ssl/server.crt
    owner: etcd
    group: etcd
    mode: 0644
- name: "Copy over the etcd member key"
  copy:
    src: "{{ pki_cert_artifacts_dir }}/{{inventory_hostname}}.key"
    remote_src: false
    dest: /etc/etcd/ssl/server.key
    owner: etcd
    group: etcd
    mode: 0600
    
- name: "Generate configuration file /etc/etcd/etcd.conf"
  template:
    src: templates/etcd.conf.j2
    dest: /etc/etcd/etcd.conf

- name: "Create etcd service (copy systemd service file)"
  template:
    src: templates/etcd.service.j2
    dest: /etc/systemd/system/etcd.service

- name: "Enable and start etcd service"
  systemd:
    daemon_reload: true
    name: etcd
    enabled: true
    state: started

- name: "Wait for port 2379 to become open on the host"
  wait_for:
    port: 2379
    host: 127.0.0.1
    state: started
    timeout: 120
    delay: 10
  ignore_errors: false

- block:
    - name: "Wait until the etcd cluster is healthy"
      command: /usr/local/bin/etcdctl --ca-file="/etc/etcd/ssl/ca.crt" --endpoints https://127.0.0.1:2379 --cert-file=/etc/etcd/ssl/server.crt --key-file=/etc/etcd/ssl/server.key cluster-health
      environment:
        ETCDCTL_API: 2
      register: etcd_health_result
      run_once: true
      changed_when: false
      until: "'cluster is healthy' in etcd_health_result.stdout"
      retries: 1000
      delay: 10
      ignore_errors: false

    - name: "Cluster health"
      run_once: true
      debug:
        var: etcd_health_result.stdout_lines

...
